<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유럽 나라 이름 받기 🌍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#a5e4f7; --sea-2:#78d2ef;
    --land:#fff5d8; --land-line:#c08f57;
    --off:#e2ece5; --off-line:#bdd0c4;
    --hot:#ffd23f; --ok:#6fe39a; --no:#ff90a8; --pop:#8b6cff;
    --ink:#42405a; --soft:#7d7a95;
    --disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:12px 12px 24px;min-height:100dvh;
    font-family:var(--body);color:var(--ink);
    background:
      radial-gradient(700px 420px at 12% 0%, #ffe9f2 0%, transparent 62%),
      radial-gradient(760px 460px at 92% 8%, #e6fbe9 0%, transparent 60%),
      linear-gradient(170deg,#e9f8ff 0%,#fff3e2 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:12px}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .ttl{line-height:1.25}
  h1{font-family:var(--disp);font-size:23px;font-weight:400;margin:0}
  #courseTag{font-size:11.5px;color:var(--soft)}
  .chips{display:flex;gap:7px}
  .chip{background:#fff;border-radius:14px;padding:5px 12px;text-align:center;min-width:62px;
        box-shadow:0 3px 0 #e4dff5}
  .chip b{display:block;font-family:var(--disp);font-size:19px;font-weight:400;line-height:1.15}
  .chip span{font-size:9.5px;color:var(--soft);letter-spacing:.08em}

  .stage{position:relative;width:100%;border-radius:24px;overflow:hidden;min-height:320px;
    background:linear-gradient(180deg,var(--sea) 0%,var(--sea-2) 100%);
    box-shadow:0 8px 0 #cfe9f3, 0 18px 40px -18px rgba(60,90,120,.5);touch-action:manipulation}
  .waves{position:absolute;inset:0;pointer-events:none;opacity:.35;
    background-image:repeating-linear-gradient(180deg,transparent 0 26px,rgba(255,255,255,.6) 26px 28px)}
  .stage svg{display:block;width:100%;height:auto;position:relative}

  path.c{fill:var(--off);stroke:var(--off-line);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}
  path.t{fill:var(--land);stroke:var(--land-line);stroke-width:1.1;vector-effect:non-scaling-stroke;
    cursor:pointer;transition:fill .12s}
  path.t:hover{fill:#ffe6a8}
  path.t.hit{fill:var(--ok)}
  path.t.bad{fill:var(--no)}
  path.t.hint{fill:var(--hot)}
  text.nm{font-family:var(--disp);font-size:15px;fill:#5b4326;text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:rgba(255,245,216,.95);stroke-width:3.5px;display:none}

  .floor{position:absolute;left:0;right:0;bottom:0;height:8px;pointer-events:none;
    background:repeating-linear-gradient(90deg,#ffd23f 0 14px,#ffb703 14px 28px)}
  .stage.warn .floor{animation:ff .4s infinite alternate}
  @keyframes ff{to{background:repeating-linear-gradient(90deg,#ff90a8 0 14px,#ff6b8b 14px 28px)}}

  .drop{position:absolute;left:0;top:0;transform:translate(-50%,0);pointer-events:none;will-change:transform}
  .tag{display:inline-block;background:#fff;color:var(--ink);font-family:var(--disp);font-size:18px;
    padding:6px 15px;border-radius:999px;border:3px solid var(--pop);white-space:nowrap;
    box-shadow:0 4px 0 rgba(139,108,255,.32)}
  .drop.low .tag{border-color:#ff5d7e;color:#e03a5f;animation:wob .17s infinite alternate}
  @keyframes wob{from{transform:rotate(-8deg) scale(1.02)}to{transform:rotate(8deg) scale(1.12)}}
  .drop.gone{animation:pop .3s ease forwards}
  @keyframes pop{to{transform:translate(-50%,-22px) scale(.5);opacity:0}}

  .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);opacity:0;pointer-events:none;
    font-family:var(--disp);font-size:15px;padding:6px 14px;border-radius:999px;background:#fff}
  .toast.show{animation:tst 1.1s ease forwards}
  @keyframes tst{15%{opacity:1;transform:translate(-50%,4px) scale(1.06)}
                 30%{transform:translate(-50%,0) scale(1)}100%{opacity:0}}
  .toast.ok{color:#1c9c5b;box-shadow:0 3px 0 #b9f0d0}
  .toast.no{color:#d94f6e;box-shadow:0 3px 0 #ffd0da}

  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{font-family:var(--disp);font-size:14px;color:var(--ink);cursor:pointer;background:#fff;
    border:0;border-radius:14px;padding:9px 15px;box-shadow:0 4px 0 #ded8f0;
    transition:transform .08s,box-shadow .08s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #ded8f0}
  button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.go{background:var(--pop);color:#fff;box-shadow:0 4px 0 #6344d6;font-size:16px;padding:11px 22px}
  button.go2{background:#ffd23f;box-shadow:0 4px 0 #dda700}

  .courses{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:540px}
  .cbtn{background:#fff;border-radius:16px;padding:9px 14px;text-align:left;
    box-shadow:0 4px 0 #e6e0f7;font-family:var(--disp);font-size:14.5px;line-height:1.3}
  .cbtn small{display:block;font-family:var(--body);font-size:10.5px;color:var(--soft)}
  .cbtn.sel{background:var(--pop);color:#fff;box-shadow:0 4px 0 #6344d6}
  .cbtn.sel small{color:#e3dbff}

  .screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;padding:22px 18px;
    background:rgba(255,252,244,.94);overflow:auto}
  .screen.off{display:none}
  .screen h2{font-family:var(--disp);font-weight:400;font-size:25px;margin:0}
  .screen p{margin:0;font-size:13px;line-height:1.7;max-width:420px;color:#5f5c76}
  .big{font-family:var(--disp);font-size:50px;color:var(--pop);line-height:1}
  .review{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:440px;max-height:92px;overflow:auto}
  .review span{font-family:var(--disp);font-size:13px;padding:4px 11px;border-radius:999px;
    background:#fff0f3;color:#d94f6e;box-shadow:0 2px 0 #ffd8e0}
  .spinner{width:34px;height:34px;border:4px solid #e3dcff;border-top-color:var(--pop);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{font-size:10.5px;color:#9a97ac;text-align:center;line-height:1.7}
  @media (max-width:430px){
    h1{font-size:18px}.chip b{font-size:16px}.chip{min-width:52px;padding:4px 8px}
    .tag{font-size:15px;padding:5px 12px;border-width:2.5px}
    .cbtn{font-size:13px;padding:8px 11px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="ttl">
      <h1>유럽 나라 이름 받기 🌍</h1>
      <div id="courseTag">코스를 고르고 시작해요</div>
    </div>
    <div class="chips">
      <div class="chip"><b id="score">0</b><span>점수</span></div>
      <div class="chip"><b id="level">1</b><span>레벨</span></div>
      <div class="chip"><b id="lives">♥♥♥</b><span>생명</span></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="waves"></div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="유럽 지도"></svg>
    <div class="floor"></div>
    <div class="toast" id="toast"></div>

    <div class="screen" id="loadScreen">
      <div class="spinner" id="spin"></div>
      <h2 id="loadTitle">지도 그리는 중…</h2>
      <p id="loadMsg">실제 국경 데이터를 내려받고 있어요. 처음 한 번만 인터넷이 필요해요.</p>
      <button id="btnReload" class="go2" style="display:none">다시 시도</button>
    </div>

    <div class="screen off" id="startScreen">
      <h2>오늘은 어느 지역을 익힐까?</h2>
      <div class="courses" id="courses"></div>
      <p id="courseDesc"></p>
      <div class="controls">
        <button class="go" id="btnChallenge">도전 모드</button>
        <button class="go2" id="btnPractice">연습 모드 (이름 보기)</button>
      </div>
    </div>

    <div class="screen off" id="endScreen">
      <h2 id="endTitle">게임 끝!</h2>
      <div class="big" id="finalScore">0</div>
      <p id="finalLine"></p>
      <div class="review" id="review"></div>
      <div class="controls">
        <button class="go" id="btnRetry">한 번 더!</button>
        <button id="btnHome">코스 바꾸기</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btnHint">💡 힌트 (3)</button>
    <button id="btnNames">🏷️ 이름 보기</button>
    <button id="btnMusic">🎵 음악 켜기</button>
  </div>

  <div class="foot">
    지역 구분: 교과서(「지리학의 개념과 지역」) 기준 · 회색 나라는 이번 코스 문제에 없어요<br>
    지도 데이터: Natural Earth (world-atlas) · 인터넷이 막힌 컴퓨터에서는 지도를 불러오지 못할 수 있어요
  </div>
</div>

<script>
/* ── 1. 국가 31개 + 교과서식 지역 코스 ────── */
const TARGETS=[
  /* 서부 유럽 */
  {id:"826",ko:"영국",en:["United Kingdom"]},
  {id:"372",ko:"아일랜드",en:["Ireland"]},
  {id:"250",ko:"프랑스",en:["France"]},
  {id:"528",ko:"네덜란드",en:["Netherlands"]},
  {id:"056",ko:"벨기에",en:["Belgium"]},
  {id:"276",ko:"독일",en:["Germany"]},
  {id:"756",ko:"스위스",en:["Switzerland"]},
  {id:"040",ko:"오스트리아",en:["Austria"]},
  /* 북부 유럽 */
  {id:"578",ko:"노르웨이",en:["Norway"]},
  {id:"752",ko:"스웨덴",en:["Sweden"]},
  {id:"246",ko:"핀란드",en:["Finland"]},
  {id:"208",ko:"덴마크",en:["Denmark"]},
  /* 남부 유럽 */
  {id:"620",ko:"포르투갈",en:["Portugal"]},
  {id:"724",ko:"스페인",en:["Spain"]},
  {id:"380",ko:"이탈리아",en:["Italy"]},
  {id:"705",ko:"슬로베니아",en:["Slovenia"]},
  {id:"191",ko:"크로아티아",en:["Croatia"]},
  {id:"070",ko:"보스니아 헤르체고비나",en:["Bosnia and Herz.","Bosnia and Herzegovina"]},
  {id:"008",ko:"알바니아",en:["Albania"]},
  {id:"300",ko:"그리스",en:["Greece"]},
  /* 동부 유럽 */
  {id:"616",ko:"폴란드",en:["Poland"]},
  {id:"203",ko:"체코",en:["Czechia","Czech Rep.","Czech Republic"]},
  {id:"703",ko:"슬로바키아",en:["Slovakia"]},
  {id:"348",ko:"헝가리",en:["Hungary"]},
  {id:"642",ko:"루마니아",en:["Romania"]},
  {id:"100",ko:"불가리아",en:["Bulgaria"]},
  {id:"233",ko:"에스토니아",en:["Estonia"]},
  {id:"428",ko:"라트비아",en:["Latvia"]},
  {id:"440",ko:"리투아니아",en:["Lithuania"]},
  {id:"112",ko:"벨라루스",en:["Belarus"]},
  {id:"804",ko:"우크라이나",en:["Ukraine"]}
];
const byId={}; TARGETS.forEach(function(t){byId[t.id]=t;});

const COURSES=[
  {key:"west", name:"서부 유럽", desc:"산업과 경제가 발달한 지역이에요. 영국·프랑스·독일이 대표 나라!",
   ids:["826","372","250","528","056","276","756","040"]},
  {key:"north",name:"북부 유럽", desc:"교육과 의료 등 복지가 발달한 지역이에요. 스칸디나비아반도를 찾아보세요.",
   ids:["578","752","246","208"]},
  {key:"south",name:"남부 유럽", desc:"지중해 연안에 자리한 지역이에요. 반도 세 개(이베리아·이탈리아·발칸)를 기억!",
   ids:["620","724","380","705","191","070","008","300"]},
  {key:"east", name:"동부 유럽", desc:"발전 잠재력이 큰 지역이에요. 발트 3국은 위에서부터 에스토니아·라트비아·리투아니아!",
   ids:["616","203","703","348","642","100","233","428","440","112","804"]},
  {key:"all",  name:"유럽 전체", desc:"31개국 총정리. 네 지역을 모두 마쳤다면 도전!",
   ids:TARGETS.map(function(t){return t.id;})}
];
let course=COURSES[0];

function matchTarget(g){
  const id=String(g.id||"").padStart(3,"0");
  if(byId[id]) return byId[id];
  const nm=(g.properties&&g.properties.name)||"";
  return TARGETS.find(function(t){return t.en.indexOf(nm)>=0;})||null;
}

/* ── 2. 실제 국경 데이터로 지도 만들기 ─────── */
const FRAME={w:-12.5,e:41,s:34.5,n:71.5};
const RAD=Math.PI/180, P1=40*RAD, P2=60*RAD, L0=16*RAD;
const NC=Math.log(Math.cos(P1)/Math.cos(P2))/
         Math.log(Math.tan(Math.PI/4+P2/2)/Math.tan(Math.PI/4+P1/2));
const FC=Math.cos(P1)*Math.pow(Math.tan(Math.PI/4+P1/2),NC)/NC;
function proj(lon,lat){                                  // 람베르트 정각 원뿔도법
  const th=NC*(lon*RAD-L0);
  const r=FC/Math.pow(Math.tan(Math.PI/4+lat*RAD/2),NC);
  return [r*Math.sin(th), r*Math.cos(th)];
}
function decodeArcs(topo){
  const s=topo.transform.scale, t=topo.transform.translate;
  return topo.arcs.map(function(arc){
    let x=0,y=0;
    return arc.map(function(d){x+=d[0];y+=d[1];return [x*s[0]+t[0], y*s[1]+t[1]];});
  });
}
function ringFrom(idxs,arcs){
  const pts=[];
  idxs.forEach(function(i){
    let a = i<0 ? arcs[~i].slice().reverse() : arcs[i];
    if(pts.length) a=a.slice(1);
    for(let k=0;k<a.length;k++) pts.push(a[k]);
  });
  return pts;
}
function ringsOf(g,arcs){
  if(g.type==="Polygon") return g.arcs.map(function(r){return ringFrom(r,arcs);});
  if(g.type==="MultiPolygon"){
    const out=[];
    g.arcs.forEach(function(poly){poly.forEach(function(r){out.push(ringFrom(r,arcs));});});
    return out;
  }
  return [];
}
function clipSide(ring,inside,cut){
  const out=[];
  for(let i=0;i<ring.length;i++){
    const A=ring[i], B=ring[(i+1)%ring.length], ai=inside(A), bi=inside(B);
    if(ai) out.push(A);
    if(ai!==bi) out.push(cut(A,B));
  }
  return out;
}
function clipFrame(ring){
  const vx=function(c){return function(A,B){const t=(c-A[0])/(B[0]-A[0]);return [c,A[1]+t*(B[1]-A[1])];};};
  const hz=function(c){return function(A,B){const t=(c-A[1])/(B[1]-A[1]);return [A[0]+t*(B[0]-A[0]),c];};};
  let r=ring;
  r=clipSide(r,function(p){return p[0]>=FRAME.w;},vx(FRAME.w)); if(r.length<3) return null;
  r=clipSide(r,function(p){return p[0]<=FRAME.e;},vx(FRAME.e)); if(r.length<3) return null;
  r=clipSide(r,function(p){return p[1]>=FRAME.s;},hz(FRAME.s)); if(r.length<3) return null;
  r=clipSide(r,function(p){return p[1]<=FRAME.n;},hz(FRAME.n)); if(r.length<3) return null;
  return r;
}
function areaOf(r){
  let a=0;
  for(let i=0;i<r.length;i++){const p=r[i],q=r[(i+1)%r.length];a+=p[0]*q[1]-q[0]*p[1];}
  return Math.abs(a/2);
}

const svg=document.getElementById("map");
const paths={}, labels={};
let mapReady=false;

const SOURCES=[
  "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json",
  "https://unpkg.com/world-atlas@2/countries-50m.json",
  "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
];
async function loadMap(){
  let topo=null,err=null;
  for(let i=0;i<SOURCES.length;i++){
    try{
      const res=await fetch(SOURCES[i]);
      if(!res.ok) throw new Error(res.status);
      topo=await res.json(); break;
    }catch(e){err=e;}
  }
  if(!topo) throw err||new Error("no data");
  buildMap(topo);
}
function buildMap(topo){
  const arcs=decodeArcs(topo);
  const drawn=[];
  topo.objects.countries.geometries.forEach(function(g){
    const rings=[];
    ringsOf(g,arcs).forEach(function(r){
      const c=clipFrame(r);
      if(c && areaOf(c)>0.02) rings.push(c);
    });
    if(rings.length) drawn.push({t:matchTarget(g), rings:rings});
  });

  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  drawn.forEach(function(d){
    d.xy=d.rings.map(function(r){
      return r.map(function(p){
        const q=proj(p[0],p[1]);
        if(q[0]<minX)minX=q[0]; if(q[0]>maxX)maxX=q[0];
        if(q[1]<minY)minY=q[1]; if(q[1]>maxY)maxY=q[1];
        return q;
      });
    });
  });
  const VW=1000, K=VW/(maxX-minX), VH=(maxY-minY)*K;
  const px=function(q){return [(q[0]-minX)*K,(q[1]-minY)*K];};
  svg.setAttribute("viewBox","0 0 "+VW+" "+VH.toFixed(0));
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");

  const NS="http://www.w3.org/2000/svg";
  const gOff=document.createElementNS(NS,"g"), gTar=document.createElementNS(NS,"g"),
        gTxt=document.createElementNS(NS,"g");

  drawn.forEach(function(d){
    const dstr=d.xy.map(function(r){
      return r.map(function(p,i){
        const q=px(p); return (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);
      }).join(" ")+"Z";
    }).join(" ");
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",dstr);
    p.setAttribute("fill-rule","evenodd");
    if(d.t){
      p.setAttribute("class","c");
      p.dataset.id=d.t.id;
      p.setAttribute("tabindex","0");
      p.setAttribute("role","button");
      p.setAttribute("aria-label",d.t.ko);
      gTar.appendChild(p);
      paths[d.t.id]=p;
      let big=d.xy[0], ba=-1;
      d.xy.forEach(function(r){const a=areaOf(r); if(a>ba){ba=a;big=r;}});
      let sx=0,sy=0;
      big.forEach(function(pt){const q=px(pt);sx+=q[0];sy+=q[1];});
      const tx=document.createElementNS(NS,"text");
      tx.setAttribute("class","nm");
      tx.setAttribute("x",(sx/big.length).toFixed(1));
      tx.setAttribute("y",(sy/big.length+5).toFixed(1));
      tx.textContent=d.t.ko;
      gTxt.appendChild(tx);
      labels[d.t.id]=tx;
    }else{
      p.setAttribute("class","c");
      p.dataset.id="__off";
      gOff.appendChild(p);
    }
  });
  svg.appendChild(gOff); svg.appendChild(gTar); svg.appendChild(gTxt);
  mapReady=true;
  applyCourse();
  document.getElementById("loadScreen").classList.add("off");
  document.getElementById("startScreen").classList.remove("off");
}
loadMap().catch(function(){
  document.getElementById("spin").style.display="none";
  document.getElementById("loadTitle").textContent="앗, 지도가 안 열려요";
  document.getElementById("loadMsg").textContent="인터넷 연결을 확인한 뒤 다시 시도해 주세요.";
  const b=document.getElementById("btnReload");
  b.style.display=""; b.onclick=function(){location.reload();};
});

function applyCourse(){
  if(!mapReady) return;
  TARGETS.forEach(function(t){
    const inC=course.ids.indexOf(t.id)>=0;
    if(paths[t.id]) paths[t.id].setAttribute("class", inC?"t":"c");
    if(labels[t.id]) labels[t.id].style.display=(showNames&&inC)?"":"none";
  });
  document.getElementById("courseTag").textContent=
    "코스 · "+course.name+" ("+course.ids.length+"개국)";
}

/* ── 3. 소리 ───────────────────────────────── */
let actx=null, musicOn=false, seq=null;
const SEMI={C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
function hz(n){const m=/^([A-G]#?)(\d)$/.exec(n);return 440*Math.pow(2,((SEMI[m[1]]+(+m[2]+1)*12)-69)/12);}
const MELODY=[["E5",4],["B4",2],["C5",2],["D5",4],["C5",2],["B4",2],
              ["A4",4],["A4",2],["C5",2],["E5",4],["D5",2],["C5",2],
              ["B4",6],["C5",2],["D5",4],["E5",4],
              ["C5",4],["A4",4],["A4",4],[null,4],
              ["D5",6],["F5",2],["A5",4],["G5",2],["F5",2],
              ["E5",6],["C5",2],["E5",4],["D5",2],["C5",2],
              ["B4",4],["B4",2],["C5",2],["D5",4],["E5",4],
              ["C5",4],["A4",4],["A4",4],[null,4]];
const BASS=[["E3",8],["E2",8],["A2",8],["A2",8],["G#2",8],["G#2",8],["A2",8],["E3",8],
            ["D3",8],["D3",8],["C3",8],["C3",8],["B2",8],["E3",8],["A2",8],["A2",8]];
let mI=0,bI=0,mT=0,bT=0;

function ac(){
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    actx=new AC();
  }
  return actx;
}
function blip(f,t,dur,type,vol){
  const c=ac(); if(!c) return;
  if(t<c.currentTime) t=c.currentTime;          // 지난 시각 예약 방지
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+.02);
}
function sixteenth(){const bpm=118+((G&&G.running)?G.level:1)*5;return 60/bpm/4;}
function pump(){
  const c=ac();
  if(!musicOn||!c||c.state!=="running") return;
  const ahead=c.currentTime+0.3, s=sixteenth();
  while(mT<ahead){
    const n=MELODY[mI%MELODY.length];
    if(n[0]) blip(hz(n[0]),mT,n[1]*s*0.85,"square",0.055);
    mT+=n[1]*s; mI++;
  }
  while(bT<ahead){
    const n=BASS[bI%BASS.length];
    blip(hz(n[0]),bT,n[1]*s*0.8,"triangle",0.05);
    bT+=n[1]*s; bI++;
  }
}
function musicStart(restart){
  const c=ac(); if(!c||!musicOn) return;
  const go=function(){
    if(!musicOn) return;
    if(restart||seq===null){ mT=bT=c.currentTime+0.12; if(restart){mI=0;bI=0;} }
    if(mT<c.currentTime) mT=c.currentTime+0.12;
    if(bT<c.currentTime) bT=c.currentTime+0.12;
    clearInterval(seq); seq=setInterval(pump,60); pump();
  };
  if(c.state==="suspended"){ c.resume().then(go).catch(go); } else { go(); }
}
function musicStop(){clearInterval(seq);seq=null;}
function sfxOK(cb){const c=ac(); if(!c)return; const t=c.currentTime,b=520+Math.min(cb,8)*45;
  blip(b,t,.09,"square",.12); blip(b*1.5,t+.07,.12,"square",.1);}
function sfxBad(){const c=ac(); if(!c)return; const t=c.currentTime;
  blip(170,t,.13,"sawtooth",.1); blip(120,t+.1,.16,"sawtooth",.09);}
function sfxMiss(){const c=ac(); if(!c)return; const t=c.currentTime;
  [330,262,196].forEach(function(f,i){blip(f,t+i*.09,.14,"square",.1);});}
function sfxLevel(){const c=ac(); if(!c)return; const t=c.currentTime;
  [523,659,784,1046].forEach(function(f,i){blip(f,t+i*.06,.13,"square",.1);});}
function sfxOver(){
  const c=ac(); if(!c)return;
  musicStop();
  const t=c.currentTime;
  [440,392,330,262,196].forEach(function(f,i){blip(f,t+i*.16,.3,"triangle",.11);});
  setTimeout(function(){ if(musicOn) musicStart(true); },1300);   // 결과 화면에서 다시 재생
}

/* ── 4. 게임 ───────────────────────────────── */
const stage=document.getElementById("stage"), toast=document.getElementById("toast"),
      elScore=document.getElementById("score"), elLevel=document.getElementById("level"),
      elLives=document.getElementById("lives"), btnHint=document.getElementById("btnHint"),
      btnNames=document.getElementById("btnNames"), btnMusic=document.getElementById("btnMusic"),
      startScreen=document.getElementById("startScreen"), endScreen=document.getElementById("endScreen");
let G=null, raf=null, showNames=false;

const coursesBox=document.getElementById("courses");
COURSES.forEach(function(c){
  const b=document.createElement("button");
  b.className="cbtn"+(c===course?" sel":"");
  b.innerHTML=c.name+"<small>"+c.ids.length+"개국</small>";
  b.onclick=function(){
    course=c;
    Array.prototype.forEach.call(coursesBox.children,function(x){x.classList.remove("sel");});
    b.classList.add("sel");
    document.getElementById("courseDesc").textContent=c.desc;
    applyCourse();
  };
  coursesBox.appendChild(b);
});
document.getElementById("courseDesc").textContent=course.desc;

function newGame(practice){
  G={running:true,practice:practice,score:0,lives:3,level:1,correct:0,combo:0,best:0,
     hints:3,drops:[],queue:[],lastSpawn:0,missed:[]};
  setNames(practice); refill(); paint(); applyCourse();
  startScreen.classList.add("off"); endScreen.classList.add("off");
  Array.prototype.forEach.call(document.querySelectorAll(".drop"),function(d){d.remove();});
  musicStart(true);
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function refill(){
  const ids=course.ids.slice();
  for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const s=ids[i];ids[i]=ids[j];ids[j]=s;}
  G.queue=G.queue.concat(ids);
}
function paint(){
  elScore.textContent=G.score; elLevel.textContent=G.level;
  elLives.textContent=G.practice?"∞":"♥".repeat(Math.max(0,G.lives))+"♡".repeat(Math.max(0,3-G.lives));
  btnHint.textContent="💡 힌트 ("+G.hints+")"; btnHint.disabled=G.hints<=0;
}
function fallMs(){return Math.max(4200,11000-(G.level-1)*750);}
function gapMs(){return Math.max(1200,3100-(G.level-1)*240);}
function maxDrop(){return G.level<3?1:(G.level<6?2:3);}

function spawn(){
  if(!G.queue.length) refill();
  const i=G.queue.findIndex(function(id){
    return !G.drops.some(function(d){return d.id===id;});
  });
  if(i<0) return;
  const id=G.queue.splice(i,1)[0], t=byId[id];
  const el=document.createElement("div");
  el.className="drop";
  el.innerHTML='<span class="tag">'+t.ko+'</span>';
  el.style.left=(15+Math.random()*70)+"%";
  stage.appendChild(el);
  G.drops.push({id:id,el:el,born:performance.now(),dur:fallMs(),y:0});
}
function loop(now){
  raf=requestAnimationFrame(loop);
  if(!G||!G.running) return;
  const h=stage.clientHeight-46;
  if(now-G.lastSpawn>gapMs() && G.drops.length<maxDrop()){spawn();G.lastSpawn=now;}
  let warn=false;
  for(let i=G.drops.length-1;i>=0;i--){
    const d=G.drops[i], p=(now-d.born)/d.dur;
    d.y=p*h;
    d.el.style.transform="translate(-50%,"+d.y.toFixed(1)+"px)";
    if(p>0.72){d.el.classList.add("low");warn=true;} else d.el.classList.remove("low");
    if(p>=1){ missDrop(i); if(!G.running) return; }
  }
  stage.classList.toggle("warn",warn);
}
function missDrop(i){
  const d=G.drops[i], t=byId[d.id];
  d.el.remove(); G.drops.splice(i,1);
  G.combo=0;
  if(G.missed.indexOf(t.ko)<0) G.missed.push(t.ko);
  flash(t.id,"bad"); say("아쉬워요! "+t.ko+" 😢","no"); sfxMiss();
  if(!G.practice){G.lives--; if(G.lives<=0){over();return;}}
  paint();
}
function flash(id,c){
  const p=paths[id]; if(!p) return;
  p.classList.add(c); setTimeout(function(){p.classList.remove(c);},520);
}
function say(m,k){toast.textContent=m;toast.className="toast "+k;void toast.offsetWidth;toast.classList.add("show");}

function answer(id){
  if(!G||!G.running) return;
  if(id==="__off"||course.ids.indexOf(id)<0){
    G.combo=0; say("이 나라는 이번 코스에 없어요!","no"); sfxBad(); paint(); return;
  }
  let k=-1,ky=-1;
  G.drops.forEach(function(d,i){if(d.id===id&&d.y>ky){k=i;ky=d.y;}});
  if(k>=0){
    const d=G.drops[k], h=Math.max(1,stage.clientHeight-46);
    const gain=10+Math.round((1-d.y/h)*10)+G.combo*2;
    G.score+=gain; G.correct++; G.combo++; if(G.combo>G.best)G.best=G.combo;
    d.el.classList.add("gone");
    setTimeout(function(){d.el.remove();},300);
    G.drops.splice(k,1);
    flash(id,"hit"); sfxOK(G.combo);
    say("정답! +"+gain+(G.combo>1?"  🔥"+G.combo+"연속":""),"ok");
    if(G.correct%5===0&&G.level<10){
      G.level++; sfxLevel();
      setTimeout(function(){say("레벨 "+G.level+"! 빨라져요 ⚡","ok");},800);
    }
  }else{
    G.combo=0; flash(id,"bad"); sfxBad();
    say(byId[id].ko+"… 지금 떨어지는 이름이 아니에요","no");
  }
  paint();
}
function over(){
  G.running=false; cancelAnimationFrame(raf);
  G.drops.forEach(function(d){d.el.remove();}); G.drops=[]; stage.classList.remove("warn");
  sfxOver();
  document.getElementById("endTitle").textContent=
    G.correct>=course.ids.length?"대단해요! 🏆":"게임 끝!";
  document.getElementById("finalScore").textContent=G.score;
  document.getElementById("finalLine").textContent=
    course.name+" · 맞힌 나라 "+G.correct+"개 · 최고 연속 "+G.best+" · 레벨 "+G.level;
  document.getElementById("review").innerHTML = G.missed.length
    ? "<span style=\"background:#eef6ff;color:#4a6fa5;box-shadow:0 2px 0 #d7e6f8\">다시 볼 나라</span>"
      + G.missed.map(function(n){return "<span>"+n+"</span>";}).join("")
    : "<span style=\"background:#eafff1;color:#1c9c5b;box-shadow:0 2px 0 #c5f2d8\">놓친 나라 없음! 완벽 👏</span>";
  endScreen.classList.remove("off");
}

svg.addEventListener("click",function(e){
  const p=e.target.closest("path"); if(p) answer(p.dataset.id);
});
svg.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ") return;
  const p=e.target.closest("path"); if(!p) return;
  e.preventDefault(); answer(p.dataset.id);
});

function setNames(on){
  showNames=on;
  btnNames.textContent=on?"🏷️ 이름 숨기기":"🏷️ 이름 보기";
  applyCourse();
}
btnNames.onclick=function(){setNames(!showNames);};
btnHint.onclick=function(){
  if(!G||!G.running||!G.drops.length||G.hints<=0) return;
  G.hints--;
  const t=G.drops.reduce(function(a,b){return a.y>b.y?a:b;}), p=paths[t.id];
  if(p){p.classList.add("hint");setTimeout(function(){p.classList.remove("hint");},1500);}
  paint();
};
btnMusic.onclick=function(){
  musicOn=!musicOn;
  btnMusic.textContent=musicOn?"🔇 음악 끄기":"🎵 음악 켜기";
  if(musicOn) musicStart(true); else musicStop();
};
function begin(practice){
  if(!musicOn){ musicOn=true; btnMusic.textContent="🔇 음악 끄기"; }
  newGame(practice);
}
document.getElementById("btnChallenge").onclick=function(){begin(false);};
document.getElementById("btnPractice").onclick=function(){begin(true);};
document.getElementById("btnRetry").onclick=function(){newGame(G?G.practice:false);};
document.getElementById("btnHome").onclick=function(){
  endScreen.classList.add("off"); startScreen.classList.remove("off");
};

let lastH=0;
new ResizeObserver(function(){
  const h=stage.clientHeight;
  if(lastH&&G&&G.running){
    const now=performance.now();
    G.drops.forEach(function(d){d.born=now-d.dur*(d.y/Math.max(1,lastH-46));});
  }
  lastH=h;
}).observe(stage);
</script>
</body>
